name: iOS unsigned IPA (free, sign later with Sideloadly)

on:
  workflow_dispatch:
  push:
    branches: [ios-build]

jobs:
  build:
    runs-on: macos-latest
    timeout-minutes: 60
    env:
      EXPO_PUBLIC_API_URL: http://72.60.222.81:3333/api/v1
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - name: Generate native iOS project
        run: npx expo prebuild --platform ios --no-install

      - name: Install pods
        run: cd ios && pod install

      - name: Build unsigned archive
        run: |
          cd ios
          WORKSPACE=$(ls -d *.xcworkspace | head -1)
          SCHEME="${WORKSPACE%.xcworkspace}"
          xcodebuild archive \
            -workspace "$WORKSPACE" \
            -scheme "$SCHEME" \
            -configuration Release \
            -sdk iphoneos \
            -archivePath "$PWD/build/App.xcarchive" \
            CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO CODE_SIGN_IDENTITY=""

      - name: Package IPA
        run: |
          cd ios/build
          mkdir -p Payload
          cp -R App.xcarchive/Products/Applications/*.app Payload/
          zip -qry ClearEarth-unsigned.ipa Payload

      - uses: actions/upload-artifact@v4
        with:
          name: ClearEarth-unsigned-ipa
          path: ios/build/ClearEarth-unsigned.ipa
